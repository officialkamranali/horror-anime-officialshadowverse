<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Horror Anime Studio Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0a0a0d; color: #fff; display: flex; flex-direction: column; min-height: 100vh; padding: 15px; }
    header { text-align: center; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid #222; }
    h1 { font-size: 20px; color: #ff3333; text-transform: uppercase; letter-spacing: 1px; }
    p.sub { font-size: 11px; color: #888; margin-top: 3px; }
    
    .card { background: #141418; border-radius: 12px; padding: 14px; border: 1px solid #25252e; margin-bottom: 15px; }
    label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: #bbb; text-transform: uppercase; }
    
    input, textarea, select {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
      background: #1b1b22; color: #fff; font-size: 14px; outline: none; margin-bottom: 12px;
    }
    textarea { resize: vertical; min-height: 75px; }
    
    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    button {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: #ff3333; color: #fff; font-size: 15px; font-weight: bold;
      cursor: pointer; transition: 0.2s;
    }
    button:active { background: #cc1111; }
    button.sec-btn { background: #282832; padding: 10px; font-size: 12px; margin-top: -6px; margin-bottom: 12px; }

    #preview-area {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: #141418; border-radius: 12px; padding: 15px; border: 1px solid #25252e; text-align: center;
    }
    #generatedImage {
      width: 100%; max-width: 650px; border-radius: 8px; border: 1px solid #333; margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8); display: none;
    }
    .loading-spinner { font-size: 13px; color: #ff9900; margin: 15px 0; font-weight: 500; }
    .download-btn {
      background: #007aff; text-decoration: none; color: #fff; padding: 12px 24px;
      border-radius: 8px; font-weight: bold; font-size: 14px; display: inline-block; cursor: pointer;
    }
    .engine-status { font-size: 11px; color: #00e676; margin-bottom: 8px; }
  </style>
</head>
<body>

  <header>
    <h1>Horror Anime Studio Pro</h1>
    <p class="sub">2D Dark Horror Anime Generator for YouTube Stories</p>
  </header>

  <div class="card">
    <label>1. Face Lock / Seed Number</label>
    <div class="row">
      <input type="number" id="seedInput" placeholder="Character Seed (Jaise: 12345)" class="col">
      <button class="sec-btn col" onclick="randomizeSeed()" style="max-width: 130px;">🎲 New Face</button>
    </div>
    <small style="color: #777; display:block; margin-top: -6px; margin-bottom: 12px; font-size: 11px;">
      Same character ke liye Seed Number mat badalna. Naye bhoot/character ke liye 'New Face' dabayein.
    </small>

    <label>2. Character Details (Fixed Features - Optional)</label>
    <input type="text" id="characterFeatures" placeholder="young anime boy, messy black hair, pale face, dark tired eyes">

    <label>3. Scene / Ghost / Background</label>
    <textarea id="scenePrompt" placeholder="standing in dark haunted mansion corridor, holding candle, creepy dark shadows, eerie fog"></textarea>

    <div class="row">
      <div class="col">
        <label>Aspect Ratio</label>
        <select id="aspectRatio">
          <option value="16:9">YouTube Video (16:9)</option>
          <option value="9:16">Shorts / Reels (9:16)</option>
          <option value="1:1">Square (1:1)</option>
        </select>
      </div>
    </div>

    <button id="genBtn" onclick="startGeneration()">⚡ Generate Scene</button>
  </div>

  <div id="preview-area">
    <div id="engineStatus" class="engine-status">Engine: Connecting...</div>
    <div id="loading" class="loading-spinner">Generating 2D Anime Scene... Kripya 10-20 second intezar karein.</div>
    <img id="generatedImage" src="" alt="Horror Scene">
    <br>
    <a id="downloadLink" href="#" download="horror_anime_scene.jpg" class="download-btn" style="display:none;">📥 Download HD Image</a>
  </div>

  <script>
    // Token replacement
    const HF_TOKEN = "HFAKq57Z0w5g3T1j1PN9x3uayyHLeKH;

    function randomizeSeed() {
      document.getElementById('seedInput').value = Math.floor(Math.random() * 899999) + 100000;
    }
    randomizeSeed();

    async function startGeneration() {
      const seed = parseInt(document.getElementById('seedInput').value) || 123456;
      let charFeatures = document.getElementById('characterFeatures').value.trim();
      let sceneAction = document.getElementById('scenePrompt').value.trim();
      const ratio = document.getElementById('aspectRatio').value;

      if (!sceneAction && !charFeatures) {
        return alert("Kripya Scene ya Character ka description bharein.");
      }

      sceneAction = sceneAction.replace(/blood/gi, "crimson marks").replace(/gore/gi, "horror details");

      const animeStyle = "masterpiece, dark 2D anime illustration, retro 90s horror anime screencap, inked lines, creepy dark gothic atmosphere, moody horror lighting";
      const fullPrompt = charFeatures ? `${charFeatures}, ${sceneAction}, ${animeStyle}` : `${sceneAction}, ${animeStyle}`;
      const negativePrompt = "3d, realistic, photo, render, cgi, western comic, blurry, deformed face, bad anatomy";

      let width = 1024, height = 576;
      if (ratio === "9:16") { width = 576; height = 1024; }
      if (ratio === "1:1") { width = 768; height = 768; }

      const previewArea = document.getElementById('preview-area');
      const img = document.getElementById('generatedImage');
      const loading = document.getElementById('loading');
      const downloadLink = document.getElementById('downloadLink');
      const statusText = document.getElementById('engineStatus');

      previewArea.style.display = "flex";
      loading.style.display = "block";
      img.style.display = "none";
      downloadLink.style.display = "none";
      statusText.innerText = "Engine: Primary (Hugging Face Anime)...";

      try {
        // Primary Attempt: Hugging Face SD Anime Engine
        const response = await fetch("https://api-inference.huggingface.co/models/cagliostrolab/animagine-xl-3.1", {
          headers: {
            Authorization: `Bearer ${HF_TOKEN}`,
            "Content-Type": "application/json",
          },
          method: "POST",
          body: JSON.stringify({
            inputs: fullPrompt,
            parameters: {
              negative_prompt: negativePrompt,
              seed: seed,
              width: width,
              height: height
            }
          }),
        });

        if (!response.ok) {
          throw new Error("Primary HF busy or loading");
        }

        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        showOutput(objectUrl);
        statusText.innerText = "Engine: Hugging Face (Active)";
      } catch (err) {
        // Auto-Fallback Engine (Bina ruke dusre server se load karega)
        statusText.innerText = "Engine: Auto-Switched to Secondary Backup...";
        const cleanPrompt = encodeURIComponent(fullPrompt);
        const fallbackUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?width=${width}&height=${height}&seed=${seed}&nologo=true&model=deliberate&_t=${Date.now()}`;

        const fallbackImg = new Image();
        fallbackImg.onload = () => {
          showOutput(fallbackUrl);
        };
        fallbackImg.onerror = () => {
          loading.innerText = "Server busy hai, kripya 10 second baad dobara generate karein.";
        };
        fallbackImg.src = fallbackUrl;
      }
    }

    function showOutput(url) {
      const img = document.getElementById('generatedImage');
      const loading = document.getElementById('loading');
      const downloadLink = document.getElementById('downloadLink');

      img.src = url;
      downloadLink.href = url;
      loading.style.display = "none";
      img.style.display = "block";
      downloadLink.style.display = "inline-block";
    }
  </script>
</body>
</html>
