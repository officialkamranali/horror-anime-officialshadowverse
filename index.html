<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Horror Anime AI Creator</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0d0d0f; color: #e6e6e6; display: flex; flex-direction: column; min-height: 100vh; padding: 15px; }
    header { text-align: center; margin-bottom: 20px; padding-bottom: 12px; border-bottom: 1px solid #222; }
    h1 { font-size: 20px; color: #ff3b30; text-transform: uppercase; letter-spacing: 1px; }
    p.sub { font-size: 12px; color: #888; margin-top: 4px; }
    
    .card { background: #18181c; border-radius: 12px; padding: 15px; border: 1px solid #2a2a30; margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #bbb; }
    
    input, textarea, select {
      width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #333;
      background: #232328; color: #fff; font-size: 14px; outline: none; margin-bottom: 12px;
    }
    textarea { resize: vertical; min-height: 80px; }
    
    .row { display: flex; gap: 10px; }
    .col { flex: 1; }

    button {
      width: 100%; padding: 14px; border: none; border-radius: 8px;
      background: #ff3b30; color: #fff; font-size: 15px; font-weight: bold;
      cursor: pointer; transition: 0.2s;
    }
    button:active { background: #d32f2f; }
    button.sec-btn { background: #333; padding: 10px; font-size: 13px; margin-top: -6px; margin-bottom: 12px; }

    #preview-area {
      display: none; flex-direction: column; align-items: center; justify-content: center;
      background: #18181c; border-radius: 12px; padding: 15px; border: 1px solid #2a2a30; text-align: center;
    }
    #generatedImage {
      width: 100%; max-width: 650px; border-radius: 8px; border: 1px solid #444; margin-bottom: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.8);
    }
    .loading-spinner { font-size: 14px; color: #ff9500; margin: 15px 0; }
    .download-btn {
      background: #007aff; text-decoration: none; color: #fff; padding: 12px 20px;
      border-radius: 8px; font-weight: bold; font-size: 14px; display: inline-block;
    }
  </style>
</head>
<body>

  <header>
    <h1>Horror Anime AI Creator</h1>
    <p class="sub">Face Consistent 2D Dark Anime Generator for YouTube Stories</p>
  </header>

  <div class="card">
    <label>1. Character Face Lock (Consistency Seed)</label>
    <div class="row">
      <input type="number" id="seedInput" placeholder="Character Seed (Jaise: 12345)" class="col">
      <button class="sec-btn col" onclick="randomizeSeed()" style="max-width: 130px;">🎲 New Face</button>
    </div>
    <small style="color: #777; display:block; margin-top: -6px; margin-bottom: 12px;">
      Same character ke liye is number ko mat badalna. Naya character chahiye toh 'New Face' dabayein.
    </small>

    <label>2. Character Details (Hair, Eyes, Clothes)</label>
    <input type="text" id="characterFeatures" placeholder="young anime boy, messy black hair, pale skin, white shirt">

    <label>3. Scene Action / Background</label>
    <textarea id="scenePrompt" placeholder="standing in dark foggy haunted corridor, holding a glowing candle, close up shot"></textarea>

    <div class="row">
      <div class="col">
        <label>Aspect Ratio</label>
        <select id="aspectRatio">
          <option value="16:9">YouTube Video (16:9)</option>
          <option value="9:16">Shorts / Reels (9:16)</option>
          <option value="1:1">Square (1:1)</option>
        </select>
      </div>
    </div>

    <button id="genBtn" onclick="generateHorrorScene()">⚡ Generate Scene</button>
  </div>

  <div id="preview-area">
    <div id="loading" class="loading-spinner">Generating 2D Anime Scene... Kripya 10-15 second intezar karein.</div>
    <img id="generatedImage" src="" alt="AI Horror Output" style="display:none;">
    <a id="downloadLink" href="#" download="horror_anime_scene.jpg" class="download-btn" style="display:none;">📥 Download HD Image</a>
  </div>

  <script>
    function randomizeSeed() {
      document.getElementById('seedInput').value = Math.floor(Math.random() * 899999) + 100000;
    }
    randomizeSeed();

    function generateHorrorScene() {
      const seed = document.getElementById('seedInput').value || 123456;
      let charFeatures = document.getElementById('characterFeatures').value.trim();
      let sceneAction = document.getElementById('scenePrompt').value.trim();
      const ratio = document.getElementById('aspectRatio').value;

      charFeatures = charFeatures.replace(/[()]/g, '');
      sceneAction = sceneAction.replace(/[()]/g, '');

      if (!sceneAction && !charFeatures) {
        return alert("Kripya Scene ya Character ka description likhein.");
      }

      // Strict 2D Dark Anime prompt engineering
      const stylePreset = "masterpiece, 2d hand drawn anime illustration, dark horror anime aesthetic, classic 90s horror anime screencap, sharp clean ink lineart, dark gothic shadows, atmospheric eerie lighting, flat 2d anime cel shading";
      const fullPrompt = `${charFeatures}, ${sceneAction}, ${stylePreset}`;
      
      let width = 1024;
      let height = 576;

      if (ratio === "9:16") {
        width = 576;
        height = 1024;
      } else if (ratio === "1:1") {
        width = 768;
        height = 768;
      }

      const previewArea = document.getElementById('preview-area');
      const img = document.getElementById('generatedImage');
      const loading = document.getElementById('loading');
      const downloadLink = document.getElementById('downloadLink');

      previewArea.style.display = "flex";
      loading.style.display = "block";
      loading.innerText = "Generating 2D Anime Scene... Kripya 10-15 second intezar karein.";
      img.style.display = "none";
      downloadLink.style.display = "none";

      const cleanPrompt = encodeURIComponent(fullPrompt);
      
      // Negative prompt logic to completely ban 3D/realistic photos
      const negativePrompt = encodeURIComponent("3d, realistic, photo, photograph, render, cgi, western comic, blurry");
      
      const imageUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?negative=${negativePrompt}&width=${width}&height=${height}&seed=${seed}&nologo=true&enhance=false&_t=${Date.now()}`;

      const tempImg = new Image();
      tempImg.src = imageUrl;

      tempImg.onload = () => {
        img.src = imageUrl;
        downloadLink.href = imageUrl;
        loading.style.display = "none";
        img.style.display = "block";
        downloadLink.style.display = "inline-block";
      };

      tempImg.onerror = () => {
        loading.innerText = "Server busy hai, kripya dobara try karein.";
      };
    }
  </script>
</body>
</html>
